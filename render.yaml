services:
  - type: web
    name: instagram-telegram-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src python -m ig_telegram_bot
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_TELEGRAM_USER_ID
        sync: false
      - key: SOCLIP_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: MAX_REQUESTS_PER_MINUTE
        value: "4"
      - key: MAX_UPLOAD_MB
        value: "49"
      - key: LOG_LEVEL
        value: INFO
