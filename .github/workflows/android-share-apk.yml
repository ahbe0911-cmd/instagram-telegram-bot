name: Android Share APK

on:
  push:
    paths:
      - "android-share/**"
      - ".github/workflows/android-share-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: android-share
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: cp android-share/app/build/outputs/apk/debug/app-debug.apk InstagramBotShare.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InstagramBotShare-APK
          path: InstagramBotShare.apk
          if-no-files-found: error
          retention-days: 30
